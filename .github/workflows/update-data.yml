name: Refresh conference data

on:
  schedule:
    - cron: "17 6 * * 1"   # every Monday, 06:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest open dataset
        run: git clone --depth 1 https://github.com/ccfddl/ccf-deadlines.git /tmp/ccfddl

      - name: Rebuild data/data.js
        run: |
          pip install pyyaml
          python scripts/build_data.py /tmp/ccfddl

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.js
          git diff --cached --quiet || git commit -m "Refresh conference data"
          git push
