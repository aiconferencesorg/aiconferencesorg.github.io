# Jobs shown on the site's Jobs tab.
#
# Two parts:
#   boards:   company job boards fetched automatically every day.
#             Only AI / research / robotics roles are kept (see build_jobs.py).
#   listings: positions you add by hand: faculty, postdoc, or any industry role
#             that isn't on a supported board.
#
# Edit this file right on GitHub (pencil icon), commit, and the site updates on
# the next daily run (or run the workflow by hand from the Actions tab).

boards:
  # ats: greenhouse | lever | ashby     slug: the company's name in its board URL
  - {name: Anthropic,            ats: greenhouse, slug: anthropic}
  - {name: xAI,                  ats: greenhouse, slug: xai}
  - {name: Figure,               ats: greenhouse, slug: figureai}
  - {name: Anduril,              ats: greenhouse, slug: andurilindustries}
  - {name: Google DeepMind,      ats: greenhouse, slug: deepmind}
  - {name: Samsung Research America, ats: greenhouse, slug: samsungresearchamerica}
  - {name: RoboForce,            ats: greenhouse, slug: roboforce}
  - {name: Skydio,               ats: ashby,      slug: skydio}
  - {name: OpenAI,               ats: ashby,      slug: openai}
  - {name: Cohere,               ats: ashby,      slug: cohere}
  - {name: Physical Intelligence, ats: ashby,     slug: physicalintelligence}
  - {name: Perplexity,           ats: ashby,      slug: perplexity}
  - {name: Shield AI,            ats: lever,      slug: shieldai}
  - {name: Zoox,                 ats: lever,      slug: zoox}
  - {name: Toyota Research Institute, ats: lever, slug: tri}
  # Drones, aviation and defense autonomy
  - {name: Zipline,              ats: greenhouse, slug: flyzipline}
  - {name: Skyryse,              ats: greenhouse, slug: skyryse}
  - {name: Saronic,              ats: ashby,      slug: saronic}
  - {name: Palantir,             ats: lever,      slug: palantir}
  # Humanoids, robotics and self-driving
  - {name: Agility Robotics,     ats: greenhouse, slug: agilityrobotics}
  - {name: Apptronik,            ats: greenhouse, slug: apptronik}
  - {name: 1X,                   ats: ashby,      slug: 1x}
  - {name: Wayve,                ats: ashby,      slug: wayve}
  - {name: Neuralink,            ats: greenhouse, slug: neuralink}
  # AI research and infrastructure
  - {name: Databricks,           ats: greenhouse, slug: databricks}
  - {name: Together AI,          ats: greenhouse, slug: togetherai}
  - {name: Runway,               ats: ashby,      slug: runway}
  # Big tech. Amazon and Workday sites are read through the same public JSON their
  # career pages use. Google, Meta, Apple and Microsoft offer no readable feed, so
  # they appear as saved searches under more_industry instead.
  - name: Amazon
    ats: amazon
    slug: amazon
    queries: [robotics scientist, applied scientist, research scientist, machine learning, computer vision, autonomous]
  - name: NVIDIA
    ats: workday
    slug: nvidia
    host: nvidia.wd5.myworkdayjobs.com
    tenant: nvidia
    site: NVIDIAExternalCareerSite
    queries: [research scientist, robotics, autonomous vehicles, deep learning]
  - name: Boston Dynamics
    ats: workday
    slug: bostondynamics
    host: bostondynamics.wd1.myworkdayjobs.com
    tenant: bostondynamics
    site: Boston_Dynamics
    queries: [""]

