# Academic job feeds pulled automatically every day (RSS). Only faculty, postdoc,
# PhD and research-staff postings about AI, ML, robotics or autonomy are kept,
# and anything older than 120 days is dropped, so this list maintains itself.
academic_feeds:
  - {name: robotics, source: Chronicle Jobs, url: "https://jobs.chronicle.com/jobsrss/?keywords=robotics"}
  - {name: machine learning, source: Chronicle Jobs, url: "https://jobs.chronicle.com/jobsrss/?keywords=machine+learning"}
  - {name: artificial intelligence, source: Chronicle Jobs, url: "https://jobs.chronicle.com/jobsrss/?keywords=artificial+intelligence"}
  - {name: computer vision, source: Chronicle Jobs, url: "https://jobs.chronicle.com/jobsrss/?keywords=computer+vision"}
  - {name: autonomous systems, source: Chronicle Jobs, url: "https://jobs.chronicle.com/jobsrss/?keywords=autonomous+systems"}
  - {name: natural language processing, source: Chronicle Jobs, url: "https://jobs.chronicle.com/jobsrss/?keywords=natural+language+processing"}
  - {name: unmanned aerial, source: Chronicle Jobs, url: "https://jobs.chronicle.com/jobsrss/?keywords=unmanned+aerial"}

# Saved searches on big-company career sites that can't be pulled automatically
# (shown as links under the Industry list; they always show what's open right now).
