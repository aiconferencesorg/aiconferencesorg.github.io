# Curated list of conferences shown on the site.
# key  = file name in ccfddl/ccf-deadlines (conference/AI/<key>.yml)
# area = the filter group on the site
# To add a conference, add a line and rebuild (or wait for the weekly update).
# To hide one, delete its line.

conferences:
  - {key: nips,    area: Machine Learning}
  - {key: icml,    area: Machine Learning}
  - {key: iclr,    area: Machine Learning}
  - {key: aistats, area: Machine Learning}
  - {key: uai,     area: Machine Learning}
  - {key: colt,    area: Machine Learning}
  - {key: colm,    area: Machine Learning}

  - {key: cvpr,    area: Computer Vision}
  - {key: iccv,    area: Computer Vision}
  - {key: eccv,    area: Computer Vision}
  - {key: wacv,    area: Computer Vision}
  - {key: bmvc,    area: Computer Vision}

  - {key: acl,     area: NLP}
  - {key: emnlp,   area: NLP}
  - {key: naacl,   area: NLP}
  - {key: eacl,    area: NLP}

  - {key: icra,    area: Robotics}
  - {key: iros,    area: Robotics}
  - {key: rss,     area: Robotics}
  - {key: corl,    area: Robotics}

  - {key: aaai,    area: General AI}
  - {key: ijcai,   area: General AI}
  - {key: aamas,   area: General AI}
  - {key: kr,      area: General AI}
  - {key: icaps,   area: General AI}
  - {key: ecai,    area: General AI}

# Data points to drop because they are wrong or not comparable.
exclude_rates:
  ecai: [2022]   # 2022 was the joint IJCAI-ECAI; those numbers are IJCAI's
